name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordHDRHelper
          path: build/Release/DiscordHDRHelper.exe

      - name: UI screenshot
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          $out = Join-Path $PWD "ui-screenshot.png"
          $p = Start-Process build/Release/DiscordHDRHelper.exe -ArgumentList "--screenshot=$out" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Timed out waiting for the screenshot" }
          Get-Item $out

      - name: Upload screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: ui-screenshot.png
          if-no-files-found: ignore

      # Publishes a release when a version tag is pushed, or when main gets a
      # CMake project version that has release notes but no release yet.
      - name: Check for a new release
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $m = Select-String -Path CMakeLists.txt -Pattern 'project\(DiscordHDRHelper VERSION ([0-9.]+)'
            $tag = "v" + $m.Matches[0].Groups[1].Value
            git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
            if ($LASTEXITCODE -eq 0) { "publish=false" >> $env:GITHUB_OUTPUT; exit 0 }
          }
          if (Test-Path "docs/release-notes/$tag.md") {
            "publish=true" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
          } else {
            "publish=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Discord HDR Helper ${{ steps.release.outputs.tag }}
          body_path: docs/release-notes/${{ steps.release.outputs.tag }}.md
          files: build/Release/DiscordHDRHelper.exe
