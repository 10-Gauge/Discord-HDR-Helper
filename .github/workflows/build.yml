name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordHDRHelper
          path: build/Release/DiscordHDRHelper.exe

      - name: UI screenshot
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          $out = Join-Path $PWD "ui-screenshot.png"
          $p = Start-Process build/Release/DiscordHDRHelper.exe -ArgumentList "--screenshot=$out" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Timed out waiting for the screenshot" }
          Get-Item $out

      - name: Upload screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: ui-screenshot.png
          if-no-files-found: ignore

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Discord HDR Helper ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: build/Release/DiscordHDRHelper.exe
